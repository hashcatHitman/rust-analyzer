name: release

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

permissions: {}

jobs:
  does-not-update:
    strategy:
      matrix:
        include:
          - container: quay.io/pypa/manylinux_2_28_aarch64:2026.11.01-1@sha256:fae356e9a7b1badc9ab138691b0e9e24f409cb4b68da61eec299c972e09e7c49

    runs-on: ubuntu-latest
    container: ${{ matrix.container }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

  does-update:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_aarch64:2026.11.01-1@sha256:fae356e9a7b1badc9ab138691b0e9e24f409cb4b68da61eec299c972e09e7c49

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
